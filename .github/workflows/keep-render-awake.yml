name: Keep Render awake

# Render's free tier sleeps after ~15 min without inbound traffic. GitHub cron's
# floor is 5 min (and runs can be delayed), so this is the tightest schedule
# available here - and it's well under the 15 min sleep threshold.
# Set the repo variable RENDER_URL (Settings -> Secrets and variables ->
# Actions -> Variables), e.g. https://skynet-ds.onrender.com

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_URL != '' }}
    steps:
      # Generous timeout: a cold start from sleep can take a minute.
      - run: curl -fsS --max-time 90 --retry 2 "${{ vars.RENDER_URL }}/healthz"
